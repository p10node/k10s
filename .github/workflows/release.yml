# Publishes a release when a version tag is pushed (`just tag v1.2.3`).
#
# The archive names and the checksums.txt format are not cosmetic: they are
# what internal/update matches on and verifies against, so keep them in step
# with the `release` recipe in the Justfile. internal/update's e2e test
# installs a real `just release` build and is the check that they agree.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release and upload assets
  id-token: write # lets actions/attest get a signing certificate from Sigstore
  attestations: write # stores the build provenance attestations
  artifact-metadata: write # records the attested archives for actions/attest

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false # publish uses GH_TOKEN, not git

      - uses: actions/setup-go@v7
        with:
          # go.mod's `go` line is the oldest Go the code builds with, not the
          # toolchain to ship with: reading it here once built releases with
          # Go 1.26.0, long after its standard library had security fixes
          # (crypto/tls, crypto/x509, net/http among them). Releases take the
          # newest patch of the current Go release instead; move this to
          # 1.28.x when Go 1.28 comes out.
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: test
        run: go test ./...

      - name: build every platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go version
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          STAMP="-X github.com/p10node/k10s/internal/version.Version=$VERSION -X github.com/p10node/k10s/internal/version.Commit=$COMMIT -X github.com/p10node/k10s/internal/version.Date=$DATE"
          rm -rf dist
          mkdir -p dist
          for p in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${p%/*}"; arch="${p#*/}"
            bin=k10s; [ "$os" = windows ] && bin=k10s.exe
            echo "→ $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w $STAMP" -o "dist/$bin" .
            name="k10s_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" "$bin" && rm "$bin")
            else
              (cd dist && tar czf "$name.tar.gz" "$bin" && rm "$bin")
            fi
          done
          (cd dist && sha256sum k10s_* > checksums.txt)
          ls -lh dist

      - name: verify fresh updater artifact
        env:
          K10S_UPDATE_E2E_REQUIRED: "1"
          K10S_UPDATE_E2E_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          K10S_UPDATE_E2E_COMMIT=$(git rev-parse HEAD)
          export K10S_UPDATE_E2E_COMMIT
          go test -count=1 ./internal/update -run '^TestApplyAgainstRealDistArtifacts$' -v

      # Build provenance for every archive listed in checksums.txt, signed
      # with a short-lived Sigstore certificate tied to this workflow run. It
      # comes before publish on purpose: if attesting fails, nothing goes out
      # unattested. Anyone can check an archive with
      #   gh attestation verify k10s_<tag>_<os>_<arch>.tar.gz --repo p10node/k10s
      - name: attest
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      # Hand-written notes live in docs/releases/<tag>.md and are optional:
      # without one the release still gets GitHub's generated commit list.
      # With one, the file goes on top and the generated list below it.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/releases/${{ github.ref_name }}.md"
          args=(--title "k10s ${{ github.ref_name }}" --generate-notes)
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::no $notes — publishing with generated notes only"
          fi
          gh release create "${{ github.ref_name }}" "${args[@]}" dist/*
